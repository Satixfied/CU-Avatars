[Keys]
; Windows virtual-key numbers: F5=116, F6=117, F7=118.
; Read once when the game loads. Restart after changing.
Menu=116
Restore=117
Blink=118

[Respawn]
; Keep avatar visible through WASTED; restore native identity on GTA's own black
; fade (15sec safety bound). GTA owns hospital flow; last avatar returns afterward.
ShowAvatarDeath=1
ReturnToAvatar=1

[Audio]
; Supplied barks/whines for hurt; GTA's normal voice handles breathing/effort.
HurtSounds=1

[Debug]
; Optional local QA: one-Hz state/clock trace, auto-stops after five minutes.
; Leave off for normal use. Read once when the game loads.
AnimationTrace=0
AudioTrace=0
